<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src https://script.google.com https://script.googleusercontent.com; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<title>Vault</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0B0B0C;--bg2:#111113;--card:#161618;--card2:#1D1D20;--line:#2A2A2F;--line2:#37373D;
  --text:#F2F2F3;--muted:#8D8D95;--dim:#5E5E66;
  --accent:#C9A227;--accent2:#E2C25A;--accentInk:#141006;
  --red:#E5534B;--amber:#E0A03A;--green:#4CAF7A;--blue:#5B8DEF;
  --r:16px;--r2:12px;--pad:16px;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --tabH:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
a.item,a.qa,a.cat,a.gcard,a.check,a.banner,a.chip,.list a.row{color:var(--text)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:17px}h3{font-size:15px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.right{margin-left:auto}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
#app{max-width:760px;margin:0 auto;padding:calc(var(--safeT) + 14px) var(--pad) calc(var(--tabH) + var(--safeB) + 28px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (pointer:coarse){#app{touch-action:pan-y pinch-zoom}}
.view.from-r{animation:fromR .24s cubic-bezier(.2,.8,.2,1)}
.view.from-l{animation:fromL .24s cubic-bezier(.2,.8,.2,1)}
@keyframes fromR{from{opacity:.3;transform:translateX(42%)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:.3;transform:translateX(-42%)}to{opacity:1;transform:none}}
.view.dragging{transition:none}
.view.snap{transition:transform .2s ease,opacity .2s ease}
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:14px}
.top h1{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:20px;height:20px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.syncdot.ok{background:var(--green)}.syncdot.busy{background:var(--accent);animation:pulse 1s infinite}.syncdot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,12,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:var(--safeB)}
nav.tabs .tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabH)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--accent)}
nav.tabs a.add .plus{width:44px;height:34px;border-radius:12px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center}
nav.tabs a.add .plus svg{width:22px;height:22px}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
@media (min-width:900px){
  nav.tabs{top:0;bottom:0;height:100dvh;right:auto;width:92px;border-top:0;border-right:1px solid var(--line);padding:calc(var(--safeT) + 20px) 0 0}
  nav.tabs .tabs-in{grid-template-columns:1fr;grid-auto-rows:78px;height:auto}
  #app{padding-left:calc(92px + 28px);padding-right:28px;padding-bottom:40px;max-width:calc(1240px + 92px)}
  .toast-wrap{bottom:24px!important}
}

/* ---------- cards / lists ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.section{margin-top:22px}
.section > .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section > .hd h2{font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:60px}
.item:first-child{border-top:0}
.item:active{background:var(--card2)}
.item .t{font-weight:560}
.item .s{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 calc(-1*var(--pad));padding-left:var(--pad);padding-right:var(--pad)}
.chips::-webkit-scrollbar{display:none}
.cicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;position:relative}
.cicon.sm{width:30px;height:30px;border-radius:9px;font-size:15px}
.pill{font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.red{background:rgba(229,83,75,.16);color:#FF8A82}
.pill.amber{background:rgba(224,160,58,.16);color:#F2BE6A}
.pill.green{background:rgba(76,175,122,.15);color:#7BD3A2}
.pill.grey{background:var(--card2);color:var(--muted)}
.pill.gold{background:rgba(201,162,39,.16);color:var(--accent2)}

/* ---------- buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);font-weight:600;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.danger{color:#FF8A82;border-color:rgba(229,83,75,.4)}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
label.f{display:block;margin-top:12px}
label.f > span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px}
.in,select.in,textarea.in{width:100%;height:46px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);padding:0 13px;outline:none;-webkit-appearance:none;appearance:none}
textarea.in{height:auto;min-height:84px;padding:11px 13px;resize:vertical}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.in:focus{border-color:var(--accent)}
input[type=date].in{min-width:0;display:block}
input[type=date].in::-webkit-date-and-time-value{text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > *{min-width:0}
input[type=date].in{width:100%;min-width:0;max-width:100%}
.grid2 > label.f{margin-top:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{transform:translateX(20px)}

/* ---------- home ---------- */
.search{position:relative}
.search input{height:50px;border-radius:15px;padding-left:44px;background:var(--card);border:1px solid var(--line)}
.search svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;margin-top:12px;padding:13px 14px;border-radius:var(--r);background:linear-gradient(90deg,rgba(224,160,58,.14),rgba(224,160,58,.05));border:1px solid rgba(224,160,58,.35);width:100%;text-align:left}
.banner.red{background:linear-gradient(90deg,rgba(229,83,75,.16),rgba(229,83,75,.05));border-color:rgba(229,83,75,.4)}
.quick{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,150px);gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:0 var(--pad)}
.quick::-webkit-scrollbar{display:none}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:104px}
.qa .t{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px}
.cat .n{font-size:12.5px;font-weight:600;line-height:1.2}
.cat .c{font-size:11.5px;color:var(--muted)}
.health{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.ring{--v:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--line) 0)}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:17px}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.check:first-child{border-top:0}
.check .box{width:22px;height:22px;border-radius:7px;border:1.5px dashed var(--line2);flex:none}

/* ---------- browse ---------- */
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media (min-width:560px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters select{height:40px;border-radius:11px;font-size:13.5px}
.gridv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.gridv{grid-template-columns:repeat(3,1fr)}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:130px}
.gcard .t{font-weight:600;font-size:14px;line-height:1.25}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:6px}

/* ---------- document ---------- */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:0 var(--pad)}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;height:min(58vh,440px);border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.slide .ph{text-align:center;padding:20px;color:var(--muted)}
.slide .ph .big{font-size:40px}
.slide .tag{position:absolute;left:10px;top:10px;font-size:11px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:99px}
.slide iframe{width:100%;height:100%;border:0;background:#fff}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--accent)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:start}
.kv dt{color:var(--muted);font-size:13px;padding-top:1px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{white-space:nowrap;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;font-size:15px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.num.reveal{color:var(--accent2)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.amber i{background:var(--amber)}.bar.red i{background:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.actions .btn{padding:0 8px}

/* ---------- add ---------- */
.srcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.src{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.src .e{font-size:26px}
.files{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fileitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.thumb{width:46px;height:46px;border-radius:9px;background:var(--card2);flex:none;display:grid;place-items:center;overflow:hidden;font-size:20px}
.thumb img{width:100%;height:100%;object-fit:cover}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.page{position:relative;border-radius:12px;overflow:hidden;background:var(--card2);aspect-ratio:3/4;border:1px solid var(--line)}
.page img{width:100%;height:100%;object-fit:contain}
.page .pn{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);font-size:11px;padding:2px 7px;border-radius:99px}
.page .pa{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.page .pa button{width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.7);display:grid;place-items:center;font-size:14px}
.progress{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* ---------- expiring ---------- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tm{position:relative;margin-bottom:16px}
.tm::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tm h3{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}

/* ---------- sheet / modal / toast ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px var(--pad) calc(var(--safeB) + 18px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet h2{margin-bottom:6px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.menu .item{min-height:52px}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--tabH) + var(--safeB) + 12px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#26262B;border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:520px;pointer-events:auto;animation:up .2s}
.toast.err{border-color:rgba(229,83,75,.5)}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
#viewer .vt{display:flex;gap:8px;align-items:center;padding:calc(var(--safeT) + 8px) 12px 8px;background:rgba(0,0,0,.7)}
#viewer .vb{flex:1;overflow:hidden;position:relative;touch-action:none;display:grid;place-items:center}
#viewer .vb img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
#viewer .vb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#viewer .vb.pdf{touch-action:auto}

/* ---------- lock / setup ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(var(--safeT) + 24px)}
.logo{width:76px;height:76px;margin-bottom:14px}
.pindots{display:flex;gap:14px;margin:22px 0 26px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.pindots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px;font-weight:500}
.pad button:active{background:var(--card2)}
.pad button.fn{background:transparent;border:0;font-size:15px;color:var(--muted)}
@media (max-height:600px){.pad{grid-template-columns:repeat(3,62px);gap:10px}.pad button{width:62px;height:62px;font-size:22px}.logo{width:52px;height:52px}}
body.privacy #app,body.privacy #viewer{filter:blur(24px)}
body.locked #app,body.locked nav.tabs,body.locked #viewer{visibility:hidden}

/* ---------- save animation ---------- */
#saved{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.55);animation:fadeIn .15s;pointer-events:none}
#saved .door{width:120px;height:120px;border-radius:50%;border:6px solid var(--accent);display:grid;place-items:center;position:relative;animation:door .9s cubic-bezier(.2,.9,.2,1) forwards;background:radial-gradient(circle,#1d1a0e,#0b0b0c)}
#saved .door::before,#saved .door::after{content:"";position:absolute;width:6px;height:96px;background:var(--accent);border-radius:3px;opacity:.5}
#saved .door::after{transform:rotate(90deg)}
#saved .door b{position:relative;z-index:1;font-size:46px;color:var(--accent);opacity:0;animation:tick .3s .55s forwards}
@keyframes door{0%{transform:scale(.6) rotate(-140deg);opacity:0}60%{transform:scale(1.05) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes tick{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

<script>
'use strict';
/* ==========================================================================
   Vault — single-file PWA. Sections:
   1 utils · 2 storage · 3 crypto · 4 api/sync · 5 router/render · 6 home
   7 browse · 8 document · 9 expiring · 10 add/edit/renew · 11 scan/pdf
   12 viewer · 13 settings · 14 lock · 15 linked apps · 16 boot
   ========================================================================== */
const APP_VERSION = '1.3.0';

/* ============================== 1. utils ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = (p = 'd') => p + Date.now().toString(36) + Array.from(crypto.getRandomValues(new Uint8Array(4)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 6);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYMD(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function daysLeft(doc) { const e = parseYMD(doc.ExpiryDate); return e ? daysBetween(parseYMD(todayStr()), e) : null; }
function fmtDate(s) { const d = parseYMD(s); return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : ''; }
function fmtSize(n) { n = Number(n) || 0; return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  if (s < 2592000) return Math.floor(s / 604800) + 'w ago'; return fmtDate(iso.slice(0, 10));
}
function relDays(n) {
  if (n === null) return '';
  if (n < 0) return 'expired ' + (-n === 1 ? 'yesterday' : -n + 'd ago');
  if (n === 0) return 'expires today'; if (n === 1) return 'expires tomorrow';
  if (n < 60) return n + 'd left'; if (n < 730) return Math.round(n / 30.4) + ' mo left';
  return (n / 365).toFixed(1).replace('.0', '') + ' yr left';
}
function expiryTone(n, lead = 30) { if (n === null) return 'grey'; if (n < 0) return 'red'; if (n <= Math.max(30, lead)) return 'amber'; return 'green'; }
function b64FromBuf(buf) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}
function bufFromB64(b64) { const s = atob(b64); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function maskNumber(n) {
  n = String(n || ''); if (!n) return '';
  if (n.length <= 4) return '•'.repeat(n.length);
  if (n.length <= 6) return '•'.repeat(n.length - 2) + n.slice(-2);
  return n[0] + '•••••' + n.slice(-4);
}
function mimeIcon(m = '', name = '') {
  if (/pdf/.test(m) || /\.pdf$/i.test(name)) return '📄';
  if (/^image\//.test(m)) return '🖼️';
  if (/sheet|excel|xls/.test(m + name)) return '📊';
  return '📎';
}

function toast(msg, opts = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '');
  el.innerHTML = esc(msg) + (opts.action ? ` <button class="btn sm ghost" style="height:28px;color:var(--accent)">${esc(opts.action)}</button>` : '');
  if (opts.action) $('button', el).onclick = () => { opts.onAction(); el.remove(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), opts.ms || (opts.action ? 7000 : 3200));
  return el;
}

/** Bottom sheet. Returns {el, close}. html may contain [data-close]. */
function sheet(html, opts = {}) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = (v) => { if (!scrim.isConnected) return; scrim.remove(); opts.onClose && opts.onClose(v); };
  scrim.addEventListener('click', e => { if (e.target === scrim && !opts.sticky) close(); if (e.target.closest('[data-close]')) close(); });
  document.body.appendChild(scrim);
  const first = $('input,select,textarea', scrim); if (first && opts.focus !== false) setTimeout(() => first.focus(), 60);
  return { el: $('.sheet', scrim), close };
}
function ask(title, msg, ok = 'OK', danger = false) {
  return new Promise(res => {
    const s = sheet(`<h2>${esc(title)}</h2><p class="muted">${msg}</p>
      <div class="btns" style="margin-top:16px"><button class="btn" data-v="0">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-v="1">${esc(ok)}</button></div>`,
      { onClose: v => res(!!v) });
    $$('[data-v]', s.el).forEach(b => b.onclick = () => s.close(b.dataset.v === '1'));
  });
}
function askText(title, { label = '', type = 'text', value = '', placeholder = '', note = '', ok = 'OK', inputmode = '' } = {}) {
  return new Promise(res => {
    const s = sheet(`<h2>${esc(title)}</h2>${note ? `<p class="muted small">${note}</p>` : ''}
      <label class="f"><span>${esc(label)}</span><input class="in" id="askIn" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off"${inputmode ? ` inputmode="${inputmode}"` : ''}></label>
      <div class="btns" style="margin-top:16px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="askOk">${esc(ok)}</button></div>`,
      { onClose: v => res(v ?? null) });
    const go = () => s.close($('#askIn', s.el).value);
    $('#askOk', s.el).onclick = go;
    $('#askIn', s.el).onkeydown = e => { if (e.key === 'Enter') go(); };
  });
}
function savedAnimation() {
  const el = document.createElement('div'); el.id = 'saved';
  el.innerHTML = '<div class="door"><b>✓</b></div>';
  document.body.appendChild(el);
  if (navigator.vibrate) try { navigator.vibrate(18); } catch (e) {}
  setTimeout(() => el.remove(), 1100);
}

/* ============================== 2. storage ============================== */
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem('vault.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vault.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('vault.' + k); } catch (e) {} },
};
const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('vault', 1);
      r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('kv'); db.createObjectStore('blobs'); };
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async _tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode); const st = tx.objectStore(store);
      let out; const req = fn(st);
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  get(k, store = 'kv') { return this._tx(store, 'readonly', st => st.get(k)); },
  set(k, v, store = 'kv') { return this._tx(store, 'readwrite', st => st.put(v, k)); },
  del(k, store = 'kv') { return this._tx(store, 'readwrite', st => st.delete(k)); },
  keys(store = 'kv') { return this._tx(store, 'readonly', st => st.getAllKeys()); },
  clear(store) { return this._tx(store, 'readwrite', st => st.clear()); },
};

/* ============================== 3. crypto ============================== */
const Crypto = {
  async pbkdf2Bits(secret, saltBytes, iterations, bits = 256) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations }, base, bits));
  },
  async deriveAes(pass, saltB64) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bufFromB64(saltB64), iterations: 310000 },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(key, buf) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, buf));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  },
  async decrypt(key, buf) {
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12) }, key, b.subarray(12)));
  },
  async encText(key, s) { return 'enc1:' + b64FromBuf(await this.encrypt(key, new TextEncoder().encode(s))); },
  async decText(key, s) { return new TextDecoder().decode(await this.decrypt(key, bufFromB64(String(s).slice(5)))); },
  isEnc(s) { return /^enc1:/.test(s || ''); },
  async sha256Hex(s) { return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))), b => b.toString(16).padStart(2, '0')).join(''); },
};

/* ============================== 4. api / sync ============================== */
const S = {
  url: '', key: '', docs: {}, cats: [], people: [], meta: {}, since: '', outbox: [],
  lastSync: 0, syncing: false, syncErr: '', retryIn: 0, encKey: null, form: null, files: new Map(),
  ui: LS.get('ui', { browse: { cat: '', owner: '', status: 'live', tag: '', year: '', sort: 'expiry', view: 'list' } }),
};
class ApiError extends Error { constructor(code, detail) { super(code); this.code = code; this.detail = detail; } }
const ERRORS = {
  unauthorized: 'Wrong app key.', locked: 'Bridge locked after too many wrong keys. Run unlock() in Apps Script.',
  rate_limited: 'Too many requests — wait a minute.', not_setup: 'Run setup() in the Apps Script editor first.',
  busy: 'Bridge is busy, retrying…', network: 'Offline or bridge unreachable.', too_large: 'File is larger than 20 MB.',
  encrypted_file: 'Encrypted files cannot be shared by link — use "Share file" instead.', timeout: 'The bridge took too long.',
};
const errText = e => ERRORS[e && e.code] || (e && (e.detail || e.message)) || 'Something went wrong';

async function api(action, payload = {}, { timeout = 90000, url, key } = {}) {
  const target = url || S.url; if (!target) throw new ApiError('no_url');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try {
    res = await fetch(target, {
      method: 'POST', redirect: 'follow', signal: ctrl.signal, cache: 'no-store', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({}, payload, { action, key: key || S.key, appUrl: url ? undefined : location.origin + location.pathname })),
    });
  } catch (e) { throw new ApiError(e.name === 'AbortError' ? 'timeout' : 'network'); }
  finally { clearTimeout(t); }
  let j; try { j = await res.json(); } catch (e) { throw new ApiError('bad_response', 'Bridge returned non-JSON (is the deployment set to "Anyone"?)'); }
  if (!j.ok) throw new ApiError(j.error || 'error', j.detail);
  return j;
}
const isNetErr = e => e && ['network', 'timeout', 'busy', 'rate_limited', 'bad_response'].includes(e.code);

async function loadCache() {
  const c = await DB.get('state').catch(() => null);
  if (c) Object.assign(S, { docs: c.docs || {}, cats: c.cats || [], people: c.people || [], meta: c.meta || {}, since: c.since || '', outbox: c.outbox || [] });
}
const persist = debounce(() => DB.set('state', { docs: S.docs, cats: S.cats, people: S.people, meta: S.meta, since: S.since, outbox: S.outbox }).catch(console.error), 250);
function persistNow() { return DB.set('state', { docs: S.docs, cats: S.cats, people: S.people, meta: S.meta, since: S.since, outbox: S.outbox }); }

let backoff = 0, retryTimer = null;
function scheduleRetry() {
  clearTimeout(retryTimer);
  const steps = [5, 15, 45, 120, 300];
  const secs = steps[Math.min(backoff, steps.length - 1)]; backoff++;
  S.retryIn = secs; retryTimer = setTimeout(() => sync(), secs * 1000);
}
function setSyncDot() { const d = $('#syncDot'); if (d) d.className = 'syncdot ' + (S.syncing ? 'busy' : S.syncErr ? 'err' : S.lastSync ? 'ok' : ''); }

async function sync({ full = false, quiet = true } = {}) {
  if (!S.url || S.syncing) return;
  S.syncing = true; setSyncDot();
  try {
    await flushOutbox();
    const since = full || !S.since ? '' : new Date(new Date(S.since).getTime() - 120000).toISOString();
    const r = await api('sync', { since });
    const pending = new Set(S.outbox.map(o => o.docId));
    if (r.full) { const keep = {}; for (const id of pending) if (S.docs[id]) keep[id] = S.docs[id]; S.docs = keep; }
    r.docs.forEach(d => { if (!pending.has(d.ID)) S.docs[d.ID] = d; });
    r.deleted.forEach(id => { if (!pending.has(id)) delete S.docs[id]; });
    if (r.allIds) { const all = new Set(r.allIds); Object.keys(S.docs).forEach(id => { if (!all.has(id) && !pending.has(id)) delete S.docs[id]; }); }
    S.cats = r.categories; S.people = r.people; S.meta = r.meta; S.since = r.meta.serverTime;
    S.lastSync = Date.now(); S.syncErr = ''; backoff = 0; clearTimeout(retryTimer);
    await persistNow();
    snapshotMaybe();
    updateBadge();

async function uploadPending(files, op) {

    const rec = await DB.get(f.pending, 'blobs');

    const up = await uploadBlob(rec.blob, f.name, f.enc ? 'application/octet-stream' : f.mime, p => setUploadProgress(op, f, p));
    // keep a local copy so the preview opens instantly
    S.files.set(up.driveId, { blob: rec.blob, mime: up.mime });
    if (LS.get('keepOffline', false)) DB.set('file:' + up.driveId, { blob: rec.blob, mime: up.mime, at: Date.now() }, 'blobs').catch(() => {});
    const nf = { driveId: up.driveId, name: up.name, mime: f.enc ? 'application/octet-stream' : f.mime, size: up.size, page: f.page || 0, enc: !!f.enc, origMime: f.mime, origName: f.name };
    out.push(nf);

    if (live) { live.Files = live.Files.map(x => x.pending === f.pending ? nf : x); persist(); }

async function uploadBlob(blob, name, mime, onProgress = () => {}) {

  const bytes = new Uint8Array(await blob.arrayBuffer());
  const total = Math.max(1, Math.ceil(bytes.length / CHUNK));
  const uploadId = uid('u');
  let r;
  for (let i = 0; i < total; i++) {
    const part = bytes.subarray(i * CHUNK, (i + 1) * CHUNK);
    for (let attempt = 0; ; attempt++) {

async function getFile(f) {

  let got = S.files.get(f.driveId);
  if (!got) {
    const cached = await DB.get('file:' + f.driveId, 'blobs').catch(() => null);
    if (cached) got = cached;
  }
  if (!got) {
    const parts = []; let offset = 0, size = 1, mime = f.mime;
    while (offset < size) {
      const r = await api('fileGet', { driveId: f.driveId, offset }, { timeout: 120000 });

    if (LS.get('keepOffline', false)) DB.set('file:' + f.driveId, Object.assign({ at: Date.now() }, got), 'blobs').catch(() => {});

  S.files.set(f.driveId, got);

  }

  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) lum[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
  const bw = Math.max(2, Math.round(Math.min(w, h) * 0.04));
  let sum = 0, sq = 0, n = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (x < bw || y < bw || x >= w - bw || y >= h - bw) { const v = lum[y * w + x]; sum += v; sq += v * v; n++; }
  }
  const mean = sum / n, sd = Math.sqrt(Math.max(0, sq / n - mean * mean));
  if (sd > 45) return null; // busy border → not a document-on-table shot
  const th = Math.max(28, sd * 2.5);
  const rows = new Uint16Array(h), cols = new Uint16Array(w);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (Math.abs(lum[y * w + x] - mean) > th) { rows[y]++; cols[x]++; }

  let top = 0, bot = h - 1, left = 0, right = w - 1;
  while (top < h && rows[top] < rTh) top++;

  while (left < w && cols[left] < cTh) left++;
  while (right > left && cols[right] < cTh) right--;
  const bwid = right - left + 1, bht = bot - top + 1;
  if (bwid < w * 0.3 || bht < h * 0.3 || (bwid > w * 0.96 && bht > h * 0.96)) return null;
  const pad = 0.012;
  const x0 = Math.max(0, left / w - pad), y0 = Math.max(0, top / h - pad);
  return { x: x0, y: y0, w: Math.min(1 - x0, bwid / w + 2 * pad), h: Math.min(1 - y0, bht / h + 2 * pad) };
}
/** JPEG ≤ maxBytes by stepping quality then size down. */
async function compressImage(blob, { maxBytes = 1.5 * 1024 * 1024, maxDim = 2400, crop = null, rot = 0, bmp = null } = {}) {

    for (const q of [0.86, 0.76, 0.66, 0.56]) {
      out = await canvasToBlob(c, q);
      if (out && out.size <= maxBytes) return Object.assign(out, { w: c.width, h: c.height });
    }
    dim = Math.round(dim * 0.8);
  }
  const c = renderPage(bmp, { crop, rot, maxDim: dim });

/** Minimal PDF writer: one JPEG per page (DCTDecode), page sized to A4 width. No library needed. */
async function jpegsToPdf(pages) {
  const te = new TextEncoder(); const chunks = []; let len = 0; const offs = [];
  const push = x => { const b = typeof x === 'string' ? te.encode(x) : x; chunks.push(b); len += b.length; };
  const obj = (num, write) => { offs[num] = len; push(num + ' 0 obj\n'); write(); push('\nendobj\n'); };
  push('%PDF-1.4\n%âãÏÓ\n');
  const n = pages.length, count = 2 + n * 3;
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`));
  for (let i = 0; i < n; i++) {
    const p = pages[i]; const W = p.w > p.h ? 841.89 : 595.28; const H = +(p.h * W / p.w).toFixed(2);
    const pg = 3 + 3 * i, ct = pg + 1, im = pg + 2;
    obj(pg, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    const content = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(ct, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    const bytes = new Uint8Array(await p.blob.arrayBuffer());
    obj(im, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`); push(bytes); push('\nendstream'); });
  }
  const xref = len;
  push(`xref\n0 ${count + 1}\n0000000000 65535 f \n`);
  for (let k = 1; k <= count; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${count + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}
function openScanner() {
  const pages = [];
  const s = sheet(`<h2>Scan</h2><p class="small muted">Place the document on a dark, plain surface. Auto-crop trims the background; rotate if needed. Several pages become one PDF.</p>
    <div class="pages" id="pages" style="margin-top:12px"></div>

    <button class="btn primary block" id="scanDone" disabled>Use scan</button><button class="btn ghost block" data-close>Cancel</button></div>`,
    { sticky: true, focus: false, onClose: () => pages.forEach(p => p.url && URL.revokeObjectURL(p.url)) });
  const draw = () => {
    $('#pages', s.el).innerHTML = pages.map((p, i) => `<div class="page"><img src="${p.url}" alt="Page ${i + 1}"><span class="pn">${i + 1}${p.box ? (p.crop ? ' · cropped' : ' · full') : ''}</span>
      <div class="pa"><button data-rot="${i}" aria-label="Rotate">↻</button>${p.box ? `<button data-crop="${i}" aria-label="Toggle crop">✂</button>` : ''}<button data-del="${i}" aria-label="Delete">✕</button></div></div>`).join('') ||
      `<div class="card small muted" style="grid-column:1/-1;text-align:center">No pages yet</div>`;
    $('#scanDone', s.el).disabled = !pages.length;
    $('#scanDone', s.el).textContent = pages.length > 1 ? `Use ${pages.length} pages as one PDF` : 'Use scan';
    $$('[data-rot]', s.el).forEach(b => b.onclick = () => { const p = pages[+b.dataset.rot]; p.rot = (p.rot + 90) % 360; process(p); });
    $$('[data-crop]', s.el).forEach(b => b.onclick = () => { const p = pages[+b.dataset.crop]; p.crop = !p.crop; process(p); });
    $$('[data-del]', s.el).forEach(b => b.onclick = () => { const p = pages.splice(+b.dataset.del, 1)[0]; URL.revokeObjectURL(p.url); draw(); });
  };
  const process = async p => {
    p.out = await compressImage(null, { bmp: p.bmp, crop: p.crop ? p.box : null, rot: p.rot });
    if (p.url) URL.revokeObjectURL(p.url); p.url = URL.createObjectURL(p.out); draw();
  };
  $('#addPage', s.el).onclick = () => pick('#pickCamera', async files => {
    for (const file of files) {
      try {
        const bmp = await loadBitmap(file);
        const p = { bmp, rot: 0, box: detectCrop(bmp) }; p.crop = !!p.box;

      } catch (e) { toast('Could not read that image', { error: true }); }
    }
  });
  $('#scanDone', s.el).onclick = async () => {
    const stamp = todayStr();
    if (pages.length === 1) addLocalFile(pages[0].out, `scan-${stamp}.jpg`, 'image/jpeg');
    else {
      $('#scanDone', s.el).textContent = 'Building PDF…';
      const pdf = await jpegsToPdf(pages.map(p => ({ blob: p.out, w: p.out.w, h: p.out.h })));
      addLocalFile(pdf, `scan-${stamp}.pdf`, 'application/pdf');

  };

}

function pinchZoom(area, img) {
  let s = 1, x = 0, y = 0; const pts = new Map(); let start = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
  const snapshot = () => { const p = [...pts.values()]; return { s, x, y, p: p.map(q => ({ ...q })), d: p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0 }; };
  area.addEventListener('pointerdown', e => {
    area.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); start = snapshot();
    if (pts.size === 1) { const now = Date.now(); if (now - lastTap < 300) { s = s > 1 ? 1 : 2.5; if (s === 1) { x = y = 0; } apply(); } lastTap = now; }
  });
  area.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...pts.values()];
    if (p.length > 1 && start.d) { const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); s = Math.max(1, Math.min(6, start.s * d / start.d)); }
    else if (p.length === 1 && start.p[0] && s > 1) { x = start.x + p[0].x - start.p[0].x; y = start.y + p[0].y - start.p[0].y; }
    apply();
  });
  const end = e => { pts.delete(e.pointerId); start = snapshot(); if (s === 1) { x = y = 0; apply(); } };
  area.addEventListener('pointerup', end); area.addEventListener('pointercancel', end);

}

/* ---- encryption ---- */
async function needEncKey() {
  if (S.encKey) return S.encKey;
  if (!S.meta.encSalt) { toast('Set an encryption passphrase in Settings › Security first', { error: true }); return null; }
  for (let i = 0; i < 3; i++) {
    const pass = await askText('Encryption passphrase', { label: 'Passphrase', type: 'password', ok: 'Unlock', note: 'Needed to open encrypted files on this device. Kept in memory until the app locks.' });
    if (pass === null) return null;
    try {
      const key = await Crypto.deriveAes(pass, S.meta.encSalt);
      if (await Crypto.decText(key, S.meta.encCheck) !== 'vault-ok') throw new Error();
      S.encKey = key; return key;
    } catch (e) { toast('Wrong passphrase', { error: true }); }
  }
  return null;
}
async function encryptionSheet() {
  if (S.meta.encSalt) {
    if (S.encKey) { if (await ask('Lock encrypted files?', 'Forget the passphrase key for this session.', 'Lock')) { S.encKey = null; for (const k in plainNums) delete plainNums[k]; render(); } }
    else { await needEncKey(); render(); }
    return;
  }
  const s = sheet(`<h2>Set encryption passphrase</h2>
    <div class="card small" style="border-color:rgba(229,83,75,.45);margin-top:8px"><b style="color:#FF8A82">Read this:</b> files in encrypted documents are scrambled on this device before upload. Google Drive only ever holds ciphertext. <b>If you lose this passphrase, those files are gone for good</b> — nobody, including you, can recover them. Write it down somewhere safe (not in Vault).</div>
    <label class="f"><span>Passphrase (12+ characters)</span><input class="in" type="password" id="ep1" autocomplete="new-password"></label>
    <label class="f"><span>Repeat</span><input class="in" type="password" id="ep2" autocomplete="new-password"></label>
    <label class="row small" style="margin-top:12px"><input type="checkbox" id="epOk"> I understand a lost passphrase means lost files.</label>
    <div class="btns" style="margin-top:14px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="epSave">Set passphrase</button></div>`);
  $('#epSave', s.el).onclick = async () => {
    const a = $('#ep1', s.el).value, b = $('#ep2', s.el).value;
    if (a.length < 12) return toast('Use at least 12 characters', { error: true });
    if (a !== b) return toast('Passphrases do not match', { error: true });
    if (!$('#epOk', s.el).checked) return toast('Tick the box to confirm', { error: true });
    try {
      const salt = b64FromBuf(crypto.getRandomValues(new Uint8Array(16)));
      const key = await Crypto.deriveAes(a, salt);
      const check = await Crypto.encText(key, 'vault-ok');
      const r = await api('setEnc', { salt, check });
      S.meta = r.meta; S.encKey = key; persist(); s.close(); toast('Encryption ready'); render();
    } catch (e) { toast(errText(e), { error: true }); }
  };
}

/* ============================== 14. lock ============================== */
const Lock = {
  cfg() { return LS.get('lock', null); },
  save(p) { LS.set('lock', Object.assign({}, this.cfg() || {}, p)); },
  last: Date.now(), hiddenAt: 0, buf: '',
  async hashPin(pin, salt) { const bits = await Crypto.pbkdf2Bits('vault-pin:' + pin, bufFromB64(salt), 150000); return b64FromBuf(bits); },
  lock() {
    S.encKey = null; for (const k in plainNums) delete plainNums[k]; S.files.clear(); closeViewer();
    $$('.scrim').forEach(x => x.remove());
    document.body.classList.add('locked'); $('#app').innerHTML = '';
    this.show('unlock');
  },
  unlocked() {
    $('#lock').classList.add('hidden'); $('#lock').innerHTML = '';
    document.body.classList.remove('locked'); $('#tabs').classList.remove('hidden');
    this.last = Date.now(); this.save({ fails: 0, until: 0 });
    render(); updateBadge();
    if (Date.now() - S.lastSync > 30000) sync();
  },
  show(mode, ctx = {}) {
    const c = this.cfg() || {};
    const L = $('#lock'); L.classList.remove('hidden'); this.buf = '';
    const titles = { unlock: ['Vault is locked', 'Enter your 6-digit PIN'], set: ['Create a PIN', 'Six digits, asked when Vault opens and after idle'], confirm: ['Confirm PIN', 'Enter it once more'], old: ['Current PIN', 'Enter your current PIN'] };
    const [t, sub] = titles[mode];
    L.innerHTML = `<img class="logo" src="favicon.svg" alt=""><h1 style="font-size:22px">${t}</h1><div class="muted small" id="lkSub" style="margin-top:4px;text-align:center">${sub}</div>
      <div class="pindots" id="dots6">${'<i></i>'.repeat(6)}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
        <button class="fn" data-k="bio">${mode === 'unlock' && c.bio ? 'Face ID' : ''}</button><button data-k="0">0</button><button class="fn" data-k="del">⌫</button></div>
      ${mode === 'unlock' ? '<button class="btn ghost sm" id="forgot" style="margin-top:18px">Forgot PIN?</button>' : mode === 'old' || ctx.cancel ? '<button class="btn ghost sm" id="lkCancel" style="margin-top:18px">Cancel</button>' : ''}`;
    const dots = () => $$('#dots6 i').forEach((d, i) => d.classList.toggle('on', i < this.buf.length));
    const press = async k => {
      if (k === 'bio') { if (mode === 'unlock' && c.bio) this.bio(); return; }
      if (k === 'del') { this.buf = this.buf.slice(0, -1); dots(); return; }
      if (this.buf.length >= 6) return;
      this.buf += k; dots();
      if (this.buf.length === 6) { const pin = this.buf; setTimeout(() => this.submit(mode, pin, ctx), 80); }
    };
    $$('[data-k]', L).forEach(b => b.onclick = () => press(b.dataset.k));
    L.onkeydown = null;
    document.onkeydown = e => { if (L.classList.contains('hidden')) return; if (/^\d$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('del'); };
    const f = $('#forgot'); if (f) f.onclick = () => this.forgot();
    const cn = $('#lkCancel'); if (cn) cn.onclick = () => { L.classList.add('hidden'); L.innerHTML = ''; document.body.classList.remove('locked'); render(); };
    if (mode === 'unlock' && c.bio && !ctx.noAuto && document.visibilityState === 'visible') setTimeout(() => this.bio(true), 300);
  },
  shake(msg) { const d = $('#dots6'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); if (msg) $('#lkSub').textContent = msg; this.buf = ''; setTimeout(() => $$('#dots6 i').forEach(i => i.classList.remove('on')), 300); },
  async submit(mode, pin, ctx) {
    const c = this.cfg() || {};
    if (mode === 'unlock' || mode === 'old') {
      if (c.until && Date.now() < c.until) return this.shake(`Too many tries — wait ${Math.ceil((c.until - Date.now()) / 1000)} s`);
      if (await this.hashPin(pin, c.salt) === c.hash) { if (mode === 'old') return this.show('set', { cancel: true }); return this.unlocked(); }
      const fails = (c.fails || 0) + 1;
      const until = fails >= 5 ? Date.now() + Math.min(900, 30 * 2 ** (fails - 5)) * 1000 : 0;
      this.save({ fails, until });
      return this.shake(fails >= 5 ? `Wrong PIN. Locked for ${Math.round((until - Date.now()) / 1000)} s` : `Wrong PIN (${5 - fails} left before a pause)`);
    }
    if (mode === 'set') return this.show('confirm', { first: pin, cancel: ctx.cancel });
    if (mode === 'confirm') {
      if (pin !== ctx.first) { this.show('set', { cancel: ctx.cancel }); return setTimeout(() => this.shake('PINs did not match — try again'), 50); }
      const salt = b64FromBuf(crypto.getRandomValues(new Uint8Array(16)));
      this.save({ hash: await this.hashPin(pin, salt), salt, idle: (c.idle || 5), fails: 0, until: 0 });
      toast('PIN set');
      this.unlocked();
      if (!c.hash && await this.bioAvailable()) {
        if (await ask('Use Face ID / fingerprint?', 'Unlock Vault with this device’s biometrics. Your PIN still works as a backup.', 'Turn on')) this.enrollBio();
      }
    }
  },
  changePin() { document.body.classList.add('locked'); this.show('old'); },
  async forgot() {
    const key = await askText('Reset PIN', { label: 'App key', type: 'password', note: 'Enter the 48-character app key from your Apps Script setup log to set a new PIN.', ok: 'Verify' });
    if (key === null) return;
    if (key.trim() === S.key) { this.save({ hash: null, fails: 0, until: 0 }); this.show('set'); }
    else toast('That is not the app key for this device', { error: true });
  },
  async bioAvailable() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } },
  async enrollBio() {
    if (!await this.bioAvailable()) { toast('Biometric unlock is not available on this device/browser', { error: true }); return false; }
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Vault' },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'vault-' + location.hostname, displayName: 'Vault' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none',
      } });
      this.save({ bio: b64FromBuf(cred.rawId) }); toast('Biometric unlock on'); return true;
    } catch (e) { toast('Biometric setup cancelled', { error: true }); return false; }
  },
  async bio(auto) {
    const c = this.cfg() || {}; if (!c.bio) return;
    try {
      await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: bufFromB64(c.bio) }], userVerification: 'required', timeout: 60000 } });
      this.unlocked();
    } catch (e) { if (!auto) toast('Biometric check failed — use your PIN', { error: true }); }
  },
  watch() {
    ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, () => { this.last = Date.now(); }, { passive: true, capture: true }));
    setInterval(() => { if (!document.body.classList.contains('locked') && (this.cfg() || {}).hash && Date.now() - this.last > ((this.cfg() || {}).idle || 5) * 60000) this.lock(); }, 10000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { this.hiddenAt = Date.now(); document.body.classList.add('privacy'); }
      else {
        document.body.classList.remove('privacy');
        const idle = ((this.cfg() || {}).idle || 5) * 60000;
        if (!document.body.classList.contains('locked') && (this.cfg() || {}).hash && this.hiddenAt && Date.now() - this.hiddenAt > idle) this.lock();
        else if (!document.body.classList.contains('locked') && Date.now() - S.lastSync > 60000) sync();
      }
    });
  },
};

  $('#lTest', s.el).onclick = async () => { try { const r = await api('list', {}, { url: val().url, key: val().key, timeout: 45000 }); const n = (r.items || r.data || r.rows || r.cars || r.transactions || r.tasks || []).length; toast(`${name} answered: ${n} items`); } catch (e) { toast(name + ': ' + errText(e), { error: true }); } };
  $('#lSave', s.el).onclick = async () => {
    const links = Object.assign({}, S.meta.links || {}, { [app]: val() });
    try { const r = await api('setLinks', { links }); S.meta = r.meta; persist(); s.close(); toast(name + ' saved'); render(); } catch (e) { toast(errText(e), { error: true }); }
  };
}
async function importLedger() {
  const s = sheet(`<h2>Import from Ledger</h2><p class="small muted">Only items with a Drive file are shown. Vault stores the Drive ID as a read-only reference — no file is copied or moved.</p>
    <div class="grid2"><label class="f"><span>Category</span><select class="in" id="liCat">${S.cats.map(c => `<option ${c.Name === 'Finance & Tax' ? 'selected' : ''}>${esc(c.Name)}</option>`).join('')}</select></label>
    <label class="f"><span>Owner</span><select class="in" id="liOwn">${S.people.map(p => `<option>${esc(p.Name)}</option>`).join('')}</select></label></div>
    <div id="liL" class="small muted" style="margin-top:10px">Loading…</div>
    <div class="btns" style="margin-top:14px"><button class="btn" data-close>Close</button><button class="btn primary" id="liGo" disabled>Import selected</button></div>`, { focus: false });
  try {
    const have = new Set(docList().filter(d => d.LinkedApp === 'ledger').map(d => d.LinkedID));
    const items = (await linkedList('ledger')).filter(i => i.driveId && !have.has(i.id));
    $('#liL', s.el).innerHTML = items.length ? `<div class="list">${items.slice(0, 300).map((i, n) => `<label class="item"><input type="checkbox" data-n="${n}"><div class="grow"><div class="t ellipsis">${esc(i.label)}</div><div class="s">${esc(i.sub)}</div></div></label>`).join('')}</div>` : '<div class="empty">Nothing new with a file attached.</div>';
    s.el.addEventListener('change', () => { $('#liGo', s.el).disabled = !$$('[data-n]:checked', s.el).length; });
    $('#liGo', s.el).onclick = () => {
      const chosen = $$('[data-n]:checked', s.el).map(c => items[+c.dataset.n]);
      chosen.forEach(i => {
        const d = Object.assign(EMPTY_DOC(), { ID: uid('d'), Title: i.label, Category: $('#liCat', s.el).value, Owner: $('#liOwn', s.el).value, IssueDate: /^\d{4}-\d{2}-\d{2}$/.test(i.date) ? i.date : '', Tags: 'ledger', LinkedApp: 'ledger', LinkedID: i.id, Created: new Date().toISOString(),
          Files: [{ driveId: i.driveId, name: i.label, mime: i.mime || '', size: 0, ref: true }] });
        saveLocal(d);
      });
      s.close(); toast(`Imported ${chosen.length} reference${chosen.length === 1 ? '' : 's'} from Ledger`);
    };
  } catch (e) { $('#liL', s.el).textContent = errText(e); }
}
async function createFlowTask(doc) {
  const l = (S.meta.links || {}).flow; if (!l || !l.url || !l.tasks) return;
  const exp = parseYMD(doc.ExpiryDate); if (!exp) return;
  const due = new Date(exp); due.setDate(due.getDate() - leadOf(doc));
  const dueStr = due.getFullYear() + '-' + String(due.getMonth() + 1).padStart(2, '0') + '-' + String(due.getDate()).padStart(2, '0');
  const link = location.origin + location.pathname + '#doc=' + doc.ID;
  try {
    await api(FLOW_ADD_ACTION, { task: { title: '🔐 Renew: ' + doc.Title, text: '🔐 Renew: ' + doc.Title + ' #personal !high', tags: ['personal'], priority: 'high', due: dueStr, notes: 'Expires ' + doc.ExpiryDate + '\n' + link, source: 'vault', sourceId: doc.ID } }, { url: l.url, key: l.key, timeout: 45000 });
    toast('Flow task created');
  } catch (e) { toast('Flow task not created: ' + errText(e), { error: true }); }
}

/* ============================== 16. boot ============================== */
function showConnect(change) {
  const cur = { url: S.url, key: '' };
  const html = `<div style="width:100%;max-width:420px"><div style="text-align:center"><img class="logo" src="favicon.svg" alt=""><h1>${change ? 'Change connection' : 'Welcome to Vault'}</h1>
    <p class="muted small">Connect to your own Apps Script bridge. Everything stays in your Google Drive and Sheet.</p></div>
    <label class="f"><span>Bridge URL (Deploy › Web app URL)</span><input class="in" id="cU" value="${esc(cur.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></label>
    <label class="f"><span>App key (48 characters, from the setup log)</span><input class="in" id="cK" type="password" autocomplete="off" spellcheck="false"></label>
    <button class="btn primary block" id="cGo" style="margin-top:16px">Connect</button>
    ${change ? '<button class="btn ghost block" id="cCancel" style="margin-top:8px">Cancel</button>' : '<p class="tiny dim" style="text-align:center;margin-top:14px">New here? Follow SETUP.md in the repository.</p>'}
    <div id="cErr" class="small" style="color:#FF8A82;margin-top:10px;text-align:center"></div></div>`;
  const L = $('#lock'); L.classList.remove('hidden'); L.innerHTML = html; document.body.classList.add('locked');
  const cc = $('#cCancel'); if (cc) cc.onclick = () => { L.classList.add('hidden'); document.body.classList.remove('locked'); render(); };
  $('#cGo').onclick = async () => {
    const url = $('#cU').value.trim(), key = $('#cK').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return $('#cErr').textContent = 'That does not look like an Apps Script web-app URL (…/exec).';
    if (key.length < 32) return $('#cErr').textContent = 'The app key is 48 characters.';
    $('#cGo').disabled = true; $('#cGo').textContent = 'Connecting…'; $('#cErr').textContent = '';
    try {
      await api('ping', {}, { url, key });
      const changedBridge = url !== S.url;
      S.url = url; S.key = key; LS.set('cfg', { url, key });
      if (changedBridge) { S.docs = {}; S.since = ''; S.outbox = []; }
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
      await sync({ full: true });
      if (!(Lock.cfg() || {}).hash) Lock.show('set'); else Lock.unlocked();
    } catch (e) { $('#cErr').textContent = errText(e); $('#cGo').disabled = false; $('#cGo').textContent = 'Connect'; }
  };
}
/* ---- device helpers: on-screen keyboard, drag & drop, paste, shortcuts ---- */
const unlockedNow = () => !document.body.classList.contains('locked') && !!S.url;
function isTyping(el) { return el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'file', 'color', 'range'].includes(el.type)) || el.isContentEditable); }
function deviceHelpers() {
  // hide the tab bar while the phone keyboard is up so it never covers a field
  const coarse = matchMedia('(pointer:coarse)');
  document.addEventListener('focusin', e => { if (coarse.matches && isTyping(e.target)) document.body.classList.add('kb'); });
  document.addEventListener('focusout', () => setTimeout(() => { if (!isTyping(document.activeElement)) document.body.classList.remove('kb'); }, 120));

  // drop or paste files anywhere -> Add form
  const incoming = async files => {
    if (!unlockedNow() || !files.length) return;
    const add = async () => {
      for (const x of files) {
        if (/^image\//.test(x.type) && x.size > 1.5 * 1024 * 1024) {
          try { const out = await compressImage(x); addLocalFile(out, (x.name || 'image').replace(/\.\w+$/, '') + '.jpg', 'image/jpeg'); continue; } catch (e) {}
        }
        addLocalFile(x, x.name || ('pasted-' + todayStr() + '.' + ((x.type.split('/')[1] || 'bin').replace('jpeg', 'jpg'))), x.type);
      }
      toast(files.length + ' file' + (files.length > 1 ? 's' : '') + ' added');
    };
    if (['add', 'edit', 'renew'].includes(parseRoute().view) && S.form) add();
    else { addEventListener('hashchange', () => setTimeout(add, 0), { once: true }); location.hash = '#add'; }
  };
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  let depth = 0;
  addEventListener('dragenter', e => { if (hasFiles(e) && unlockedNow()) { depth++; document.body.classList.add('dragging'); } });
  addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; document.body.classList.remove('dragging'); incoming(Array.from(e.dataTransfer.files)); });
  addEventListener('paste', e => { const files = Array.from((e.clipboardData && e.clipboardData.files) || []); if (files.length) { e.preventDefault(); incoming(files); } });

  // keyboard shortcuts (PC, iPad with keyboard)
  addEventListener('keydown', e => {
    if (!unlockedNow() || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') {
      if ($('#viewer')) return closeViewer();
      const scrims = $$('.scrim');
      if (scrims.length) return scrims[scrims.length - 1].dispatchEvent(new MouseEvent('click', { bubbles: true }));
      if (['doc', 'edit', 'renew'].includes(parseRoute().view)) return goBack();
      return;
    }
    if (isTyping(e.target) || $('.scrim') || $('#viewer')) return;
    const go = { '/': '#home', n: '#add', b: '#browse', e: '#expiring', s: '#settings', h: '#home' }[e.key];
    if (!go) return;
    e.preventDefault();
    if (location.hash !== go) location.hash = go;
    if (e.key === '/') setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 30);
  });
}

/* ---- swipe left / right between the main tabs (touch devices) ---- */
const TAB_ORDER = ['home', 'browse', 'add', 'expiring', 'settings'];
let swipeDir = 0;
function swipeNav() {
  const app = $('#app');
  let st = null;
  const reset = v => { if (!v) return; v.classList.remove('dragging'); v.classList.add('snap'); v.style.transform = ''; v.style.opacity = ''; setTimeout(() => v.classList.remove('snap'), 220); };
  app.addEventListener('touchstart', e => {
    st = null;
    if (e.touches.length !== 1 || !unlockedNow() || $('.scrim') || $('#viewer')) return;
    const view = parseRoute().view; if (!TAB_ORDER.includes(view)) return; // only on the 5 main tabs
    const t = e.touches[0];
    if (t.clientX < 18 || t.clientX > innerWidth - 18) return;             // leave system edge-gestures alone
    if (isTyping(document.activeElement) || isTyping(e.target)) return;
    if (e.target.closest('.chips,.quick,.carousel,.pages,input,select,textarea,[data-noswipe]')) return;
    st = { x: t.clientX, y: t.clientY, t: Date.now(), lock: null, view, idx: TAB_ORDER.indexOf(view) };
  }, { passive: true });
  app.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0], dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (!st.lock) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      st.lock = Math.abs(dx) > Math.abs(dy) * 1.4 ? 'x' : 'y';
      if (st.lock === 'y') { st = null; return; }
    }
    const v = app.firstElementChild; if (!v) return;
    const edge = (dx > 0 && st.idx === 0) || (dx < 0 && st.idx === TAB_ORDER.length - 1);
    const move = edge ? dx * 0.15 : dx * 0.55;                              // rubber-band at the ends
    v.classList.add('dragging');
    v.style.transform = `translateX(${move}px)`;
    v.style.opacity = String(Math.max(0.5, 1 - Math.abs(move) / (innerWidth * 1.4)));
  }, { passive: true });
  const end = e => {
    if (!st) return;
    const s0 = st; st = null;
    const t = e.changedTouches[0], dx = t.clientX - s0.x, dt = Date.now() - s0.t;
    const v = app.firstElementChild;
    const far = Math.abs(dx) > Math.min(110, innerWidth * 0.28);
    const flick = Math.abs(dx) > 45 && dt < 260;
    const next = s0.idx + (dx < 0 ? 1 : -1);
    if (s0.lock === 'x' && (far || flick) && next >= 0 && next < TAB_ORDER.length) {
      swipeDir = dx < 0 ? 1 : -1;
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (er) {}
      location.hash = '#' + TAB_ORDER[next];
    } else reset(v);
  };
  app.addEventListener('touchend', end, { passive: true });
  app.addEventListener('touchcancel', () => { if (st) { reset(app.firstElementChild); st = null; } }, { passive: true });
  // tab-bar taps slide in the matching direction too
  $$('#tabs a').forEach(a => a.addEventListener('click', () => {
    const from = TAB_ORDER.indexOf(lastTab), to = TAB_ORDER.indexOf(a.dataset.tab);
    if (from > -1 && to > -1 && from !== to && TAB_ORDER.includes(parseRoute().view)) swipeDir = to > from ? 1 : -1;
  }));
}

async function boot() {
  deviceHelpers();
  swipeNav();
  watchPasswordFields();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const cfg = LS.get('cfg', null);
  if (cfg) { S.url = cfg.url; S.key = cfg.key; }
  try { await loadCache(); } catch (e) { console.warn('cache', e); }
  Lock.watch();
  addEventListener('online', () => sync());
  setInterval(() => { if (document.visibilityState === 'visible' && !document.body.classList.contains('locked')) sync(); }, 5 * 60000);
  if (!S.url) return showConnect(false);
  const lock = Lock.cfg();
  if (!lock || !lock.hash) Lock.show('set'); else Lock.show('unlock');
}
boot();
